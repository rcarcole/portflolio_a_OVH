<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F7A3D">
<title>La compra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="wrap">

  <header class="masthead">
    <div class="brand">
      <span class="kicker">Lista compartida</span>
      <h1>La compra</h1>
    </div>
    <div class="who" id="who" title="Sesión iniciada"></div>
  </header>

  <div class="statusbar">
    <span class="counts" id="counts">Cargando…</span>
    <span class="sync" id="sync" role="status" aria-live="polite"></span>
  </div>

  <div class="addbar">
    <input id="add-input" type="text" autocomplete="off" autocapitalize="sentences"
           enterkeyhint="done" placeholder="Añadir producto…" aria-label="Añadir producto">
    <button class="btn-add" id="add-btn">Añadir</button>
  </div>

  <!-- FALTA: lo que se ha acabado. Va arriba del todo, como una nota para llevar. -->
  <section class="missing" id="missing-wrap" hidden>
    <div class="tag">
      <div class="tag-head">
        <span class="tag-title">Falta</span>
        <span class="tag-count" id="missing-count">0</span>
      </div>
      <ul class="miss-list" id="missing-list"></ul>
    </div>
    <div class="tear" aria-hidden="true"></div>
  </section>

  <!-- EN LA LISTA -->
  <section class="stock">
    <h2 class="sec-title">En la lista</h2>
    <ul class="rows" id="list"></ul>
    <p class="empty" id="empty" hidden>Aún no hay nada. Escribe arriba lo primero que necesites.</p>
  </section>

  <footer class="foot">
    <button class="btn-ghost" id="clear-missing">Vaciar los que faltan</button>
    <span class="foot-note">Se guarda en el servidor: los dos veis la misma lista.</span>
  </footer>

</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="script.js"></script>
</body>
</html>
